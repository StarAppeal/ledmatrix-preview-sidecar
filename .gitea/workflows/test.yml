name: Test Preview Sidecar

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: heavy
    steps:
      - uses: actions/checkout@v4

      - name: Prepare resource-limited builder
        run: |
          docker buildx inspect heavy-builder >/dev/null 2>&1 || docker buildx create --name heavy-builder --driver docker-container
          docker buildx inspect --bootstrap heavy-builder >/dev/null
          docker update --cpus 2 --memory 4g --memory-swap 4g buildx_buildkit_heavy-builder0

      - name: Lint and test
        run: |
          docker buildx build --builder heavy-builder --target test --output type=cacheonly \
            .
