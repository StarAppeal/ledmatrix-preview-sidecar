name: Build and Deploy Preview Sidecar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-preview-sidecar
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: heavy
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t ledmatrix/preview-sidecar:latest \
            -t ledmatrix/preview-sidecar:${{ github.sha }} .

      - name: Deploy
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build preview-sidecar
          docker image prune -f
